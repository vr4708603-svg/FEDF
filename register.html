<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCare+ | Create Account</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="animate-fade-in">

  <!-- Navbar Hook -->
  <div id="navbar-container"></div>

  <div class="container" style="display: flex; justify-content: center;">
    <div class="auth-container" style="max-width: 550px;">
      <div class="auth-header">
        <h2>Create Account</h2>
        <p>Register as a Patient to book consultations</p>
      </div>

      <div id="error-alert" class="alert-box danger" style="display: none;"></div>
      <div id="success-alert" class="alert-box success" style="display: none;"></div>

      <form id="register-form">
        <div class="form-group">
          <label>Full Name *</label>
          <input
            id="reg-name"
            type="text"
            class="form-control"
            placeholder="e.g. Jane Doe"
            required
          />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label>Email Address *</label>
            <input
              id="reg-email"
              type="email"
              class="form-control"
              placeholder="e.g. jane@example.com"
              required
            />
          </div>
          <div class="form-group">
            <label>Password *</label>
            <input
              id="reg-password"
              type="password"
              class="form-control"
              placeholder="Min 6 characters"
              required
            />
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label>Age *</label>
            <input
              id="reg-age"
              type="number"
              class="form-control"
              placeholder="e.g. 28"
              required
            />
          </div>
          <div class="form-group">
            <label>Gender *</label>
            <select id="reg-gender" class="form-control">
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Non-binary">Non-binary</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Blood Group *</label>
            <select id="reg-blood" class="form-control">
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px;">
          <div class="form-group">
            <label>Phone Number *</label>
            <input
              id="reg-phone"
              type="text"
              class="form-control"
              placeholder="e.g. +1 (555) 000-0000"
              required
            />
          </div>
          <div class="form-group">
            <label>Residential Address</label>
            <input
              id="reg-address"
              type="text"
              class="form-control"
              placeholder="e.g. Brooklyn, NY"
            />
          </div>
        </div>

        <div class="form-group">
          <label>Prior Medical Conditions (Comma-separated)</label>
          <input
            id="reg-history"
            type="text"
            class="form-control"
            placeholder="e.g. Asthma, High Blood Pressure, Penicillin Allergy"
          />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
          Create My Account
        </button>
      </form>

      <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
        Already registered? <a href="login.html" style="color: var(--primary); font-weight: 600;">Login Here</a>
      </p>
    </div>
  </div>

  <!-- Footer Hook -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // If already logged in, redirect
      if (db.getCurrentUser()) {
        window.location.href = "patient.html";
      }

      const form = document.getElementById("register-form");
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        
        const name = document.getElementById("reg-name").value;
        const email = document.getElementById("reg-email").value;
        const password = document.getElementById("reg-password").value;
        const age = document.getElementById("reg-age").value;
        const gender = document.getElementById("reg-gender").value;
        const blood = document.getElementById("reg-blood").value;
        const phone = document.getElementById("reg-phone").value;
        const address = document.getElementById("reg-address").value;
        const historyStr = document.getElementById("reg-history").value;

        const errAlert = document.getElementById("error-alert");
        const succAlert = document.getElementById("success-alert");
        errAlert.style.display = "none";
        succAlert.style.display = "none";

        const users = db.getUsers();
        const exists = users.find((u) => u.email.toLowerCase() === email.toLowerCase());
        if (exists) {
          errAlert.textContent = "An account with this email already exists.";
          errAlert.style.display = "block";
          return;
        }

        const newUser = {
          email,
          password,
          name,
          role: "patient",
          age: parseInt(age) || 30,
          gender,
          bloodGroup: blood,
          phone,
          address: address || "Not specified",
          history: historyStr ? historyStr.split(",").map(i => i.trim()).filter(Boolean) : [],
          healthScore: 80,
        };

        users.push(newUser);
        db.setUsers(users);
        db.setCurrentUser(newUser);

        succAlert.textContent = "Registration successful! Redirecting...";
        succAlert.style.display = "block";

        setTimeout(() => {
          window.location.href = "patient.html";
        }, 1000);
      });
    });
  </script>
</body>
</html>
